apiVersion: platform.data-project.io/v1alpha1
kind: FabricPlatform
metadata:
  projectId: "Knowit Datalytics-Fabric-Platform"
  environment: dev
  approvedEntities:
    - { id: PLAT-LZ-0001, status: validated }
    - { id: PLAT-COMP-0001, status: validated }
    - { id: PLAT-SEC-0001, status: validated }
    - { id: PLAT-OPS-0001, status: validated }

platform:
  region: swedencentral

  resourceGroups:
    platform: rg-kd-fabric-dev-swc-001

  tags:
    environment: dev
    workload: fabric-platform
    owner: soham-karfa
    cost_center: knowit-datalytics-dev
    data_classification: internal
    managed_by: terraform

  capacity:
    mode: "Microsoft Fabric capacity"
    name: fckddevswc001
    sku: F2
    capacityId: "[NEEDS HUMAN INPUT: dev capacity id]"
    administrationMembers:
      - "soham.karfa_knowit.se#EXT#@knowitsandbox.onmicrosoft.com"

  workspaces:
    - name: "Knowit Datalytics - Dev"
      purpose: "Initial development workspace"
      capacityRef: fckddevswc001
      domain: "[NEEDS HUMAN INPUT: workspace domain]"

  storage:
    enabled: false
    type: null
    zones: []
    redundancy: null

  network:
    enabled: false
    posture: "Deferred; no additional network resources in initial setup"
    publicAccess: "No new public-access exception approved"

  identity:
    authentication: "Microsoft Entra ID"
    assignments:
      - principalRef: "soham.karfa_knowit.se#EXT#@knowitsandbox.onmicrosoft.com"
        principalType: User
        role: administrator

  operations:
    owner: soham-karfa
    administration: manual
    capacitySizing: "Fixed F2; increases require a separate approved change"
    performanceCommitment: "No initial performance or concurrency guarantee"
    availability: "Best-effort development; planned downtime acceptable"
    disasterRecovery: "No custom disaster-recovery or recovery-time commitment"
    dataPolicy: "Synthetic or non-sensitive development data only"
    recovery: "Development data must be reproducible or disposable"
    configurationManagement: "Version-controlled infrastructure configuration"
    costReview: "Weekly during the first month"
    monthlyBudget: "[NEEDS HUMAN INPUT: reviewed monthly budget]"
    terraformBackend: "[NEEDS HUMAN INPUT: approved protected Terraform backend configuration]"
    scheduledAutomation: false
    dedicatedMonitoring: false

approval:
  decisionIds: []
  approvedBy: "soham karfa"
  approvedAt: "2026-09-10T17:02:41+02:00"

unresolvedInputs:
  - field: platform.capacity.capacityId
    marker: "[NEEDS HUMAN INPUT: dev capacity id]"
    reason: "Resolved through Fabric capacity discovery during human deployment; never substitute the Azure resource ID."

  - field: platform.workspaces[0].domain
    marker: "[NEEDS HUMAN INPUT: workspace domain]"
    reason: "No Fabric domain assignment was approved; this marker does not authorize creating or assigning a domain."

  - field: platform.identity.assignments[0].principalRef
    marker: "[NEEDS HUMAN INPUT: verified target-tenant principal object ID]"
    reason: "Resolve the approved UPN to its target-tenant object ID for workspace RBAC; keep the actual ID outside committed artifacts."

  - field: platform.operations.monthlyBudget
    marker: "[NEEDS HUMAN INPUT: reviewed monthly budget]"
    reason: "Requires a reviewed Sweden Central estimate before deployment readiness."

  - field: platform.operations.terraformBackend
    marker: "[NEEDS HUMAN INPUT: approved protected Terraform backend configuration]"
    reason: "Supply an approved protected backend before deployment; backend provisioning is outside this scope."
